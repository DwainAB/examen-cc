name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
        env:
          JWT_SECRET: secret-de-test-ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test -- --watchAll=false
        env:
          CI: true
      - run: npm run build
        env:
          CI: true

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        service:
          - backend
          - frontend
          - gateway
          - microservices/notifications
          - microservices/stock-management
    steps:
      - uses: actions/checkout@v4
      - run: npm audit --omit=dev --audit-level=critical
        working-directory: ${{ matrix.service }}

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - backend
          - frontend
          - gateway
          - microservices/notifications
          - microservices/stock-management
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t test-image ${{ matrix.service }}
